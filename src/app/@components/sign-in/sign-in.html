<section class="auth-wrapper">
  <div class="intro">
    <h1>Welcome back !</h1>
    <p class="intro-text">Sign in to access your surveys</p>
  </div>

  <form (submit)="$event.preventDefault()">

    <div class="input-field">
      <label class="input-title">account</label>
      <input type="text" placeholder="Your email" name="email" [(ngModel)]="account">
      <p class="reminder">{{accErrMsg}}</p>
    </div>

    <div class="input-field">
      <label class="input-title">password</label>
      <input type="password" placeholder="Your password" name="password" [(ngModel)]="password">
      <p class="reminder">{{pwdErrMsg}}</p>
    </div>



    @if (count >= 3) {
      <button type="submit" (click)="logIn()" disabled>log in</button>
    } @else {
      <button type="submit" (click)="logIn()">log in</button>
    }

    <div class="reminder-container">
      <p class="reminder">{{reminder}}</p>
    </div>
  </form>
</section>
